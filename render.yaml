# One-click deploy: Render Dashboard > New > Blueprint > pick this repo.
# The "starter" plan (~$7/mo) is needed for the persistent disk that keeps orders.db.
services:
  - type: web
    name: shop
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /data
      sizeGB: 10  # each published piece is ~50 MB (print file + web model)
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BASE_URL
        sync: false
      - key: STORE_NAME
        value: My Store
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SHIPPING_CENTS
        value: "599"
      - key: SHIP_COUNTRIES
        value: US
      - key: OWNER_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
