{% extends "base.html" %}
{% block body %}
<h1>{{ store_name }}</h1>
<div class="grid">
  {% for p in products %}
  <div class="card">
    <h2 style="margin:0">{{ p.name }}</h2>
    <p>{{ p.description }}</p>
    <div class="price">{{ p.price_display }}</div>
    <form method="post" action="/buy/{{ p.id }}"><button type="submit" style="width:100%">Buy now</button></form>
  </div>
  {% else %}
  <p class="muted">No products yet. Add some to products/catalog.json.</p>
  {% endfor %}
</div>
{% endblock %}
