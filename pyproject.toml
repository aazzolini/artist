[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artist"
version = "0.1.0"
description = "SVG letter generation tool"
requires-python = ">=3.6"
dependencies = [
    "svgwrite>=1.4.3",
    "cairosvg>=2.7.0",
    "numpy>=1.19.0",
    "Pillow>=8.0.0",
    "pycairo>=1.20.0",
    "torch>=2.0.0",
]

[tool.setuptools]
py-modules = ["gen_data"]

